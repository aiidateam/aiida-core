# Ruff configuration for aiida-core.
#
# Auto-discovered by ruff (it looks for `ruff.toml`, `.ruff.toml` or
# `pyproject.toml` in the current directory or its parents), so the
# pre-commit `ruff-format` / `ruff-check` hooks pick this up without
# an explicit `--config` flag.

exclude = [
  'docs/source/topics/processes/include/snippets/functions/parse_docstring_expose_ipython.py',
  'docs/source/topics/processes/include/snippets/functions/signature_plain_python_call_illegal.py'
]
line-length = 120

[format]
quote-style = 'single'

[lint]
ignore = [
  'F403',  # Star imports unable to detect undefined names
  'F405',  # Import may be undefined or defined from star imports
  'PLC0415',  # import-outside-top-level
  'PLR0911',  # Too many return statements
  'PLR0912',  # Too many branches
  'PLR0913',  # Too many arguments in function definition
  'PLR0915',  # Too many statements
  'PLR2004',  # Magic value used in comparison
  'PLW1641',  # Checks for classes that implement `__eq__` but not `__hash__`
  'RUF005',  # Consider iterable unpacking instead of concatenation
  'RUF012'  # Mutable class attributes should be annotated with `typing.ClassVar`
]
select = [
  'E',  # pydocstyle
  'W',  # pydocstyle
  'F',  # pyflakes
  'UP',  # pyupgrade
  'I',  # isort
  'N',  # pep8-naming
  'PLC',  # pylint-convention
  'PLE',  # pylint-error
  'PLR',  # pylint-refactor
  'PLW',  # pylint-warning
  'RUF',  # ruff
  'FLY',  # flynt
  'NPY201',  # numpy compatibility
  'TID'  # flake8-tidy-imports
]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Mark some classes as generic, per https://docs.astral.sh/ruff/settings/#lint_pyflakes_extend-generics
# Needed due to https://github.com/astral-sh/ruff/issues/9298
[lint.pyflakes]
extend-generics = ["aiida.orm.entities.Entity", "aiida.orm.entities.Collection"]
