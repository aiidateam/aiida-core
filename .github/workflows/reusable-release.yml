# Reusable release flow publishing a subpackage to PyPI and TestPyPI.
#
# A new subpackage gets its own release with a thin caller workflow, e.g.:
#
# ```yaml
# name: release-atomistic
#
# on:
#   pull_request:
#     branches-ignore: [gh-pages]
#     paths: ['aiida-atomistic/**']
#   push:
#     tags:
#     - atomistic-v[0-9]+.[0-9]+.[0-9]+*
#
# jobs:
#   release:
#     uses: ./.github/workflows/reusable-release.yml
#     with:
#       package: aiida-atomistic
#       tag-prefix: atomistic-v
#       init-module: aiida-atomistic/src/aiida_atomistic/__init__.py
#       test-path: aiida-atomistic/tests/
# ```
#
# When pushing a release tag `<tag-prefix>X.Y.Z`, the workflow publishes to
# PyPI. When the 'test-release' label is active on a PR, it publishes to
# TestPyPI on each update. In both cases pre-commit and a test subset must
# pass. On tag pushes it additionally checks that the tag matches the package
# version (see `check_release_tag.py --tag-prefix/--init-module`).

name: reusable-release

on:
  workflow_call:
    inputs:
      package:
        description: Subpackage directory containing the project
        default: aiida-core
        required: false
        type: string
      tag-prefix:
        description: Release tag prefix before the version
        default: v
        required: false
        type: string
      init-module:
        description: Package __init__.py carrying __version__ (relative to the repository root)
        default: aiida-core/src/aiida/__init__.py
        required: false
        type: string
      test-path:
        description: Test path (relative to the repository root) for the release smoke tests
        default: aiida-core/tests/
        required: false
        type: string
      python-version:
        description: Python version for the tag check, tests and publish jobs
        default: '3.10'
        required: false
        type: string
      pre-commit-python-version:
        description: Python version for the pre-commit job
        default: '3.11'
        required: false
        type: string

env:
  FORCE_COLOR: 1

jobs:

  check-release-tag:

    if: github.repository == 'aiidateam/aiida-core' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check tag
      run: python .github/workflows/check_release_tag.py $GITHUB_REF --tag-prefix ${{ inputs.tag-prefix }} --init-module ${{ inputs.init-module }}

  pre-commit:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'pull_request' && contains(fromJson(toJson(github.event.pull_request.labels)).*.name, 'test-release'))

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Install ${{ inputs.package }} and pre-commit
      uses: ./.github/actions/install-package
      with:
        python-version: ${{ inputs.pre-commit-python-version }}
        package: ${{ inputs.package }}
        extras: pre-commit
        # Full pre-commit runs in locked CI; run mypy additionally here
        # with latest compatible dependencies for release validation.
        from-lock: 'false'

    - name: Run mypy
      run: pre-commit run mypy --all-files

  tests:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'pull_request' && contains(fromJson(toJson(github.event.pull_request.labels)).*.name, 'test-release'))

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Install ${{ inputs.package }}
      uses: ./.github/actions/install-package
      with:
        python-version: ${{ inputs.python-version }}
        package: ${{ inputs.package }}

    - name: Run sub-set of test suite
      run: pytest -s -m requires_broker --broker-backend zmq --db-backend=sqlite ${{ inputs.test-path }}

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')

    name: Publish to PyPI

    needs: [check-release-tag, pre-commit, tests]

    runs-on: ubuntu-24.04

    environment: release
    permissions:
      id-token: write

    steps:
    - name: Checkout source
      uses: actions/checkout@v7
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install flit
      run: pip install "flit>=4.0.2,<5"
    - name: Build
      working-directory: ${{ inputs.package }}
      run: flit build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: ${{ inputs.package }}/dist


  publish-testpypi:
    if: github.event_name == 'pull_request' && contains(fromJson(toJson(github.event.pull_request.labels)).*.name, 'test-release')

    name: Publish to test PyPI

    needs: [pre-commit, tests]

    runs-on: ubuntu-24.04

    environment: release
    permissions:
      id-token: write

    steps:
    - name: Checkout source
      uses: actions/checkout@v7
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install flit
      run: pip install "flit>=4.0.2,<5"
    - name: Build
      working-directory: ${{ inputs.package }}
      run: flit build
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: ${{ inputs.package }}/dist
