# Thin release flow for the ``aiida-core`` subpackage over the shared reusable
# release workflow. Release mechanics (tag check, pre-commit, smoke tests,
# PyPI/TestPyPI publish) are maintained in ``reusable-release.yml``.
name: release

on:
  # pull request event we use for test releases
  pull_request:
    branches-ignore: [gh-pages]
    paths-ignore: [aiida-core/docs/**]
  # tag push event we use for the official release
  push:
    tags:
    - v[0-9]+.[0-9]+.[0-9]+*

jobs:
  release:
    uses: ./.github/workflows/reusable-release.yml
    with:
      package: aiida-core
      tag-prefix: v
      init-module: aiida-core/src/aiida/__init__.py
      test-path: aiida-core/tests/
