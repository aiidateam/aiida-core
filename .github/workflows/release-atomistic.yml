# Thin release flow for the ``aiida-atomistic`` subpackage over the shared
# reusable release workflow. Release mechanics (tag check, pre-commit, smoke
# tests, PyPI/TestPyPI publish) are maintained in ``reusable-release.yml``.
name: release-atomistic

on:
  # pull request event we use for test releases
  pull_request:
    branches-ignore: [gh-pages]
    paths: [aiida-atomistic/**]
  # tag push event we use for the official release
  push:
    tags:
    - atomistic-v[0-9]+.[0-9]+.[0-9]+*

jobs:
  release:
    uses: ./.github/workflows/reusable-release.yml
    with:
      package: aiida-atomistic
      tag-prefix: atomistic-v
      init-module: aiida-atomistic/src/aiida_atomistic/__init__.py
      test-path: aiida-atomistic/tests/
